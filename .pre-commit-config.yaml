repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        types: [text]
