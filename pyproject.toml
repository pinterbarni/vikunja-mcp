[project]
name = "vikunja-mcp"
version = "0.1.0"
description = "MCP server that exposes a self-hosted Vikunja instance as tools for MCP clients"
readme = "README.md"
authors = [{ name = "Barnabas Pinter" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
