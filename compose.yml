services:
  vikunja-mcp:
    build: .
    image: vikunja-mcp
    restart: unless-stopped
    environment:
      VIKUNJA_URL: ${VIKUNJA_URL:?set VIKUNJA_URL in .env}
      VIKUNJA_API_TOKEN: ${VIKUNJA_API_TOKEN:?set VIKUNJA_API_TOKEN in .env}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      OAUTH_ALLOWED_SUBJECTS: ${OAUTH_ALLOWED_SUBJECTS:-[]}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      vikunja-mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
