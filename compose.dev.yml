# Local Vikunja for development and manual testing. Not for production.

services:
  vikunja:
    image: vikunja/vikunja:2.7.1
    container_name: vikunja-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456/
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SECRET:-dev-only-secret-change-me-maybe}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /app/vikunja/files/vikunja.db
    volumes:
      - ./dev-data/vikunja:/app/vikunja/files
